name: Scientific integrity stage 3
on:
  push:
    branches: [fix/scientific-data-integrity]
    paths:
      - 'NB1_Data_Cleaning.ipynb'
      - 'NB2_Entity_Normalisation.ipynb'
      - 'NB3_EDA.ipynb'
      - 'data/cleaned_data*.csv'
      - 'tests/check_stage3.py'
      - '.github/workflows/scientific-integrity.yml'
  workflow_dispatch:

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - run: python tests/check_stage3.py
